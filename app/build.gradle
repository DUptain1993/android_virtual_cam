plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.vcam"
    compileSdk 36

    defaultConfig {
        applicationId "com.example.vcam"
        minSdk 21
        targetSdk 36
        versionCode 29
        versionName "4.5"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // The de.robv.android.xposed:api:82 Maven coordinate used to resolve via jcenter,
    // which has been shut down. Use the jars already vendored under libs/ instead.
    compileOnly files('libs/api-82.jar')
}